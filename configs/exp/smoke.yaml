# Tiny CPU debug config: synthetic data + a tiny CNN, no timm needed. Used by scripts/smoke_test_train.py.
exp_name: smoke
data:
  image_size: 64
model:
  name: tiny_cnn
  family: cnn
  tag: null
  pretrained: false
train:
  lr: 0.003
  epochs: 4
  horizon_epochs: 4
  warmup_epochs: 1
  batch_size: 16
  num_workers: 0
  amp: false
  early_stopping: {metric: val_macro_f1, patience: 3, min_delta: 0.0001}
queue:
  models: [tiny_cnn]
  seeds: [1, 2]
