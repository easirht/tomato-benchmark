# ============================================================================
# base.yaml : defaults shared by ALL experiments.
# Anything here that defines the experiment is part of the config hash.
# DECISIONS BELOW ARE FIXED BEFORE ANY RESULTS (see PROJECT_PLAN.md). Commit this file to git
# before the first training run; do not edit seeds/splits afterwards.
# ============================================================================
project: tomato-benchmark
exp_name: base

paths:                    # null -> auto-filled per platform (Kaggle/Colab/local)
  data_root: null
  work_root: null
  persist_dirs: []        # e.g. ["/kaggle/input/tomato-ckpts"] to resume across Kaggle sessions

protocol:
  # Seeds are decided NOW, before any result. Never change them after seeing results.
  seeds_main: [42, 43, 44, 45, 46]        # 5 seeds (1-month scope)
  seeds_reserve: [47, 48, 49, 50, 51]     # used only if compute allows; fixed now too
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    group_aware: true      # near-duplicate groups never cross splits (built in Deliverable 3)
    stratified: true
    seed: 1234             # ONE split for the whole project
  # Main-benchmark models (timm names). Hyper-parameters are identical across models.
  # `tag` pins the pretrained weights. All are ImageNet-1k only on purpose: timm's DEFAULT weights for
  # convnext_tiny / swin_tiny are ImageNet-12k/22k, which would make the CNN-vs-ViT comparison unfair.
  models_main:
    - {name: resnet50,                       family: cnn,         tag: a1_in1k}
    - {name: efficientnet_b0,                family: cnn,         tag: ra_in1k}
    - {name: convnext_tiny,                  family: cnn,         tag: fb_in1k}
    - {name: deit_small_patch16_224,         family: transformer, tag: fb_in1k}
    - {name: swin_tiny_patch4_window7_224,   family: transformer, tag: ms_in1k}
    - {name: mobilevit_s,                    family: hybrid,      tag: cvnets_in1k}
  models_optional:          # only if time allows (documented as such in the paper); tags still to be verified
    - {name: efficientnet_b3,                family: cnn}
    - {name: mobilenetv3_large_100,          family: cnn}
    - {name: vit_base_patch16_224,           family: transformer}

data:
  num_classes: 10
  image_size: 224           # main benchmark; 320/384 only for the resolution ablation
  # Canonical short names. Folder-name -> short-name mapping is built and verified in Deliverable 3.
  class_names: [bacterial_spot, early_blight, late_blight, leaf_mold, septoria_leaf_spot,
                spider_mites, target_spot, yellow_leaf_curl_virus, mosaic_virus, healthy]
  healthy_class: healthy    # binary label is derived: healthy=0, everything else=1
  image_root: null          # the PlantVillage `color` folder; null = auto-detect under paths.data_root
  split_file: split_v2.csv  # FROZEN split, read from paths.splits_dir (repo: splits/)
  input_mask: none          # none | corners  (corners = background-only sanity test, see exp/bg_test.yaml)
  mask_corner: 32           # side (px, at the 224 resolution) of each kept corner patch
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

model:                      # filled per run by iter_queue() / overrides
  name: resnet50
  family: cnn
  tag: a1_in1k              # pretrained weight tag (see protocol.models_main)
  pretrained: true          # ImageNet weights (scratch / linear-probe variants are separate experiments)

train:
  epochs: 100               # hard cap; early stopping normally ends much sooner
  early_stopping:
    metric: val_macro_f1    # selection ALWAYS on validation macro-F1
    patience: 10
    min_delta: 0.0001
  optimizer: adamw          # timm create_optimizer_v2 (no weight decay on bias / norm)
  lr: 0.0002                # PLACEHOLDER until the validation-only LR check (exp/lr_check.yaml) is run, then FROZEN
  weight_decay: 0.05
  warmup_epochs: 2          # linear warm-up, per step
  horizon_epochs: 25        # cosine decays to min_lr over this many epochs, then stays at min_lr.
                            # (a 100-epoch cosine with early stopping would keep the LR near its peak)
  min_lr: 0.000001
  label_smoothing: 0.1
  loss: ce_class_weighted   # ce_class_weighted | focal
  class_weight_power: 1.0   # weights = (N / (K * n_c)) ** power, computed on TRAIN only (1.0 = inverse frequency)
  batch_size: 64
  amp: true                 # mixed precision (fp16)
  num_workers: 3
  grad_clip: 1.0
  deterministic: false
  aug:                      # geometric only: NO colour/lighting augmentation in the baseline, so that RQ2/RQ3
    crop_scale: [0.6, 1.0]  # can test lighting augmentation as a clean intervention
    crop_ratio: [0.9, 1.1]
    dihedral: true          # random 90-degree rotation + horizontal/vertical flip (lossless)

eval:
  test: true                # false for lr_check (validation only: the test set must stay untouched)

run:
  seed: 42                  # overridden per run

checkpoint:
  save_every_epoch: true
  max_wall_hours: 8.0       # graceful stop before the session limit (platform files override)
  safety_minutes: 10
  min_minutes_to_start_run: 15   # the queue does not start a new run with less time left than this

logging:
  results_csv: runs.csv     # inside paths.results_dir
  tensorboard: true
  wandb: false
